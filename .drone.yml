---
kind: pipeline
type: docker
name: stable

trigger:
  event:
    - push

steps:
  - name: docker build
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKERHUB_USER
      password:
        from_secret: DOCKERHUB_PASS
      repo:
        from_secret: DOCKERHUB_REPOSITORY
      tags:
        - latest